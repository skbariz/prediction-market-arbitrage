[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "prediction-arb"
version = "0.1.0"
description = "Cross-exchange arbitrage scanner and execution engine for Kalshi and Polymarket prediction markets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "prediction-market-arbitrage contributors" }]
keywords = ["kalshi", "polymarket", "prediction-markets", "arbitrage", "trading", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Framework :: AsyncIO",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "cryptography>=42",
    "loguru>=0.7,<1",
    "python-dotenv>=1.0,<2",
    "rapidfuzz>=3.6,<4",
]

[project.optional-dependencies]
# Required only for live order placement on Polymarket (EIP-712 order signing).
trading = ["py-clob-client>=0.34,<0.35"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
prediction-arb = "prediction_arb.cli:main"

[project.urls]
Homepage = "https://github.com/skbariz/prediction-market-arbitrage"
Issues = "https://github.com/skbariz/prediction-market-arbitrage/issues"
Changelog = "https://github.com/skbariz/prediction-market-arbitrage/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/prediction_arb"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "docs/", "README.md", "LICENSE", "CHANGELOG.md", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# Line length is enforced by `ruff format`; long string literals are allowed.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
