name: Live opportunities

# Publishes LIVE_OPPORTUNITIES.md to the `live-data` branch every 15 minutes.
# The branch is force-pushed as a single commit so it never accumulates history,
# and `main` stays free of automated commits. Only public market data is used, so
# no exchange credentials are needed or exposed to this workflow.
#
# Generating the report installs third-party packages, so it runs with a read-only
# token and no stored credentials. The job that holds the write token only runs git.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: live-opportunities
  cancel-in-progress: true

jobs:
  generate:
    name: Generate report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Generate report
        env:
          DRY_RUN: "true"
        run: prediction-arb --env-file /dev/null report --output LIVE_OPPORTUNITIES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-opportunities
          path: LIVE_OPPORTUNITIES.md
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to live-data branch
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # force-push the live-data branch
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-opportunities
          path: ${{ runner.temp }}/report
      - name: Push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        # The token is passed to this single git command and never written to disk.
        run: |
          cd "$RUNNER_TEMP/report"
          git init --quiet --initial-branch=live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LIVE_OPPORTUNITIES.md
          git commit --quiet -m "Update live opportunities"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push --force --quiet "$REPO_URL" live-data
